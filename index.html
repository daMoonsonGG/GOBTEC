body{background:var(--fondo);color:var(--texto);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:17px}
main:focus{outline:none}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:8px 16px;background:var(--superficie2);border-bottom:1px solid var(--linea);font-size:15px}
.barra strong{margin-right:auto}
.barra label{display:inline-flex;align-items:center;gap:8px}
.barra select,.barra button{min-height:36px;border:1px solid var(--texto);border-radius:6px;background:var(--fondo);color:var(--texto);font:inherit;padding:0 10px;max-width:100%}
.barra button{cursor:pointer}
.barra button[aria-pressed="true"]{background:var(--forte);color:var(--sobre-forte)}
.vista{display:inline-flex;gap:4px}
@media (max-width: 767px){.vista{display:none}}
.marco-movil{max-width:390px;margin-inline:auto;box-shadow:0 0 0 1px var(--linea-forte),0 8px 24px rgba(0,0,0,.18);border-radius:0}
.aviso{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:calc(100vw - 32px);box-sizing:border-box;padding:12px 16px;border-radius:8px;background:var(--forte);color:var(--sobre-forte);font-size:15px;display:flex;align-items:center;gap:12px}
.aviso button{min-height:44px;padding:0 12px;border:1px solid currentColor;border-radius:8px;background:transparent;color:inherit;font:inherit;cursor:pointer}
button:disabled,input:disabled{opacity:.55;cursor:not-allowed}
.convidado{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:8px 16px;background:var(--superficie);border-bottom:1px solid var(--linea-forte);font-size:15px}
.convidado button{min-height:36px;border:1px solid var(--texto);border-radius:6px;background:var(--fondo);color:var(--texto);font:inherit;padding:0 12px;cursor:pointer}
[hidden]{display:none!important}
.limpo .barra,.limpo .convidado{display:none!important}
.barra label{white-space:nowrap}
.barra label select{flex:1 1 auto;min-width:0}
.menu-btn{display:none;min-height:44px;padding:0 14px;border:1px solid currentColor;border-radius:8px;background:transparent;color:inherit;font:inherit;cursor:pointer;align-items:center;gap:8px}
.cab-movil{border-bottom:1px solid var(--linea)}
.cab-movil-fila{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cab-marca{display:inline-flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;font-weight:700;color:var(--texto);min-width:0}
.cab-logo{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.cab-movil-nav{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:0 20px;padding:0 16px 12px}
.cab-movil-nav a{min-height:44px;display:flex;align-items:center;text-decoration:none}
.cab-ctrl{display:flex;align-items:center;gap:16px;padding-top:8px}
.tema-btn{min-height:44px;padding:0 12px;border:1px solid var(--texto);border-radius:8px;background:transparent;color:var(--texto);font:inherit;cursor:pointer}
#marco{container-type:inline-size;container-name:marco}
@container marco (max-width:767px){
.menu-btn{display:inline-flex}
.cab-movil-nav{flex-direction:column;align-items:stretch;gap:0}
[data-aberto="false"]{display:none!important}
header nav[data-aberto]:not(.cab-movil-nav){flex:1 1 100%;flex-direction:column!important;align-items:flex-start!important;gap:0!important;padding-top:4px}
header nav[data-aberto]:not(.cab-movil-nav)>*{margin:0!important}
.cab-adm-dir{flex:1 1 100%;flex-direction:column!important;align-items:flex-start!important;gap:0!important}
header>div>span:first-child,header>div>a:first-child{flex:1 1 0;min-width:0}
.hor-tabla{min-width:0!important}
.hor-cab{display:none!important}
.hor-fila{grid-template-columns:1fr 1fr!important;gap:8px!important;padding:12px 0;border-bottom:1px solid var(--linea)}
.hor-dia{grid-column:1 / -1}
.hor-cel{display:grid!important;gap:2px}
.hor-et{display:block!important;font-size:14px;color:var(--texto2)}
.hor-cont{grid-column:1 / -1!important;display:flex!important;gap:8px 12px!important}
header>div{gap:4px 12px!important}
}
@media (max-width:767px){
.barra strong{display:none}
.barra label{flex:1 1 100%}
.barra select{width:100%}
}
.entrando{animation:entrar .18s ease-out}
@keyframes entrar{from{opacity:0}to{opacity:1}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}
@media (prefers-reduced-motion: reduce){.entrando{animation:none}::view-transition-old(root),::view-transition-new(root){animation:none}}

      <p style="margin: 0 0 12px;">Esta é a declaración de accesibilidade da plataforma de reservas de instalacións deportivas municipais, preparada segundo o Real Decreto 1112/2018, do 7 de setembro, sobre accesibilidade dos sitios web e aplicacións para dispositivos móbiles do sector público.</p>

      <h2 style="margin: 32px 0 12px; font-size: 24px">Contido non accesible</h2>
      <ul style="margin: 0 0 12px; padding-left: 24px">
        <li style="margin-bottom: 8px">Mapa de situación: na versión de proba é un marcador de posición. O enderezo e as indicacións de acceso ofrécense tamén en texto.</li>

        <li style="margin-bottom: 8px">Probas con produtos de apoio: aínda non se verificou o uso con lectores de pantalla (NVDA, Orca, VoiceOver) nin con dispositivos reais. Está previsto antes da posta en produción.</li>
        <li style="margin-bottom: 8px">Reflow (WCAG 1.4.10): comprobado a 320 px en todas as pantallas con axe-core, sen desprazamento horizontal; non se verificou en dispositivos reais.</li>
      </ul>
      <h2 style="margin: 32px 0 12px; font-size: 24px">Preparación desta declaración</h2>
      <p style="margin: 0 0 12px;">A declaración preparouse o 5 de novembro de 2026. O método empregado foi unha autoavaliación realizada pola equipa de desenvolvemento, con comprobacións automáticas (axe-core, regras WCAG 2.1 A e AA, en todas as pantallas, en galego, castelán e inglés e en modo claro e escuro) e revisión manual. Non houbo auditoría externa.</p>

  <main id="contido" style="max-width: 860px; overflow-wrap: anywhere; margin: 0 auto; padding: 32px clamp(16px, 4vw, 40px) 64px">
    <h1 style="margin: 0 0 24px; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.12">Política de privacidade</h1>
      <p role="note" style="margin: 0 0 24px; padding: 12px 16px; border-radius: 8px; background: var(--superficie); border: 1px solid var(--linea-forte)"><strong>Modelo de proba. O concello e o seu delegado de protección de datos deben revisar e completar este texto antes de publicalo.</strong></p>
      <p style="margin: 0 0 12px;">Esta política explica como trata os teus datos persoais a plataforma de reservas de instalacións deportivas municipais, conforme ao Regulamento (UE) 2016/679 (RGPD) e á Lei Orgánica 3/2018.</p>
      <h2 style="margin: 32px 0 12px; font-size: 24px">Responsable do tratamento</h2>
      <p style="margin: 0 0 12px;">O concello que xestiona a instalación na que reservas.</p>
      <p style="margin: 0 0 12px;"><strong style="margin-right: 6px">Contacto do concello:</strong> {{correoContacto}}</p>
      <p style="margin: 0 0 12px;">Delegado ou delegada de protección de datos: o contacto indicará o concello (campo por completar).</p>
      <h2 style="margin: 32px 0 12px; font-size: 24px">Que datos tratamos</h2>
      <ul style="margin: 0 0 12px; padding-left: 24px">
        <li style="margin-bottom: 8px">Identificación: nome e correo electrónico, que recibimos do servizo de identificación (Chave365 ou Cl@ve). Non recibimos nin gardamos o teu contrasinal.</li>
        <li style="margin-bottom: 8px">Contacto opcional: teléfono móbil, só se o indicas para recibir avisos por SMS ou WhatsApp.</li>
        <li style="margin-bottom: 8px">Reservas: instalación, pista, data e hora, número de persoas, estado (confirmada, cancelada, asistida ou non presentada) e canle de reserva.</li>
      </ul>
      <h2 style="margin: 32px 0 12px; font-size: 24px">Para que os usamos e con que base</h2>
      <ul style="margin: 0 0 12px; padding-left: 24px">
        <li style="margin-bottom: 8px">Xestionar as reservas e o uso das instalacións municipais. Base xurídica: o exercicio de poderes públicos e a execución dunha misión de interese público (art. 6.1.e RGPD).</li>
        <li style="margin-bottom: 8px">Avisarche por correo de cambios ou peches que afecten ás túas reservas. Mesma base.</li>
        <li style="margin-bottom: 8px">Enviarche avisos por SMS ou WhatsApp. Base xurídica: o teu consentimento expreso (art. 6.1.a RGPD), que podes retirar en calquera momento desde «A miña conta».</li>
      </ul>
      <h2 style="margin: 32px 0 12px; font-size: 24px">Destinatarios e transferencias</h2>
      <p style="margin: 0 0 12px;">Os datos non se ceden a terceiros salvo obriga legal. Se activas WhatsApp, o teu número de teléfono compártese con Meta Platforms para enviar as mensaxes, o que pode implicar transferencias internacionais. Se só activas o correo ou o SMS, non se comparte con Meta.</p>
      <h2 style="margin: 32px 0 12px; font-size: 24px">Canto tempo os conservamos</h2>
      <p style="margin: 0 0 12px;">Proposta de proba (o concello debe fixar os prazos definitivos): mentres teñas a conta activa e, despois de borrala, só o tempo necesario para atender posibles responsabilidades; o historial de reservas conservarase anonimizado para estatísticas.</p>
      <h2 style="margin: 32px 0 12px; font-size: 24px">Os teus dereitos</h2>

        <button type="button" onClick="{{lerFalso}}" style="min-height: 48px; padding: 0 4px; border-radius: 8px; border: 1px solid var(--texto); background: var(--fondo); color: var(--texto); font: inherit; font-size: 15px; cursor: pointer">Falso</button>
      </div>

      <sc-if value="{{enEspera}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; padding: 16px; border-radius: 12px; background: var(--superficie)">Apunta a cámara ao código da persoa.</p>

        <div style="border: 2px solid var(--texto); border-radius: 12px; padding: 16px">

        <div style="border: 2px solid var(--texto); border-radius: 12px; padding: 16px">
          <p style="margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font-size: 21px; font-weight: 700">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>

        </div>
      </sc-if>
    </div>

<template id="t-FichaMobil">
<div data-tema="{{tema}}" style="width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: var(--texto); background: var(--fondo); font-size: 17px; line-height: 1.5; display: flex; flex-direction: column">

on></span></nav></header>

  <main style="flex: 1 1 auto; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div>
      <h1 style="margin: 0; font-size: 28px; line-height: 1.15">{{titulo}}</h1>
      <sc-if value="{{modificando}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="margin: 8px 0 0; padding: 12px; border-radius: 8px; background: var(--superficie); border: 2px solid var(--texto)">
          <strong>Estás cambiando a hora dunha reserva</strong><br><span>{{textoModificando}}</span><br>
          <button type="button" onClick="{{deixarModificar}}" style="margin-top: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--texto); background: var(--fondo); color: var(--texto); font: inherit; cursor: pointer">Deixar a reserva como estaba</button>
        </div>
      </sc-if>
      <p style="margin: 8px 0 0; color: var(--texto2)">{{subtitulo}}</p>
      <details style="margin-top: 12px; border-block: 1px solid var(--linea); padding: 8px 0">
        <summary style="min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 700">Prezos e descontos · {{prezoBaseTexto}}</summary>
        <p style="margin: 4px 0 8px">{{unidadeTexto}}</p>
        <ul style="margin: 0; padding-left: 20px; font-size: 15px">
          <sc-for list="{{descontos}}" as="d" hint-placeholder-count="3"><li><strong>{{d.nome}}: −{{d.porcentaxe}} %</strong> · {{d.tipo}} · {{d.vixencia}}</li></sc-for>
        </ul>
      </details>
    </div>

    <div role="group" aria-label="Pista" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px">
      <sc-for list="{{pistas}}" as="p" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{p.activa}}" onClick="{{p.elixir}}" style="min-height: 44px; border-radius: 8px; border: 1px solid var(--texto); background: {{p.fondo}}; color: {{p.texto}}; font: inherit; cursor: pointer">{{p.nome}}</button>
      </sc-for>
    </div>

      <sc-for list="{{dias}}" as="d" hint-placeholder-count="7">
        <button type="button" aria-pressed="{{d.activo}}" aria-label="{{d.aria}}" onClick="{{d.elixir}}" style="min-height: 56px; padding: 0; border-radius: 8px; border: 1px solid var(--texto); background: {{d.fondo}}; color: {{d.texto}}; font: inherit; font-size: 14px; line-height: 1.2; cursor: pointer">{{d.curto}}<br><strong style="font-size: 17px">{{d.numero}}</strong></button>
      </sc-for>
    </div>

    <h2 aria-live="polite" style="margin: 0; font-size: 20px">{{rotuloDia}}</h2>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{franxas}}" as="f" hint-placeholder-count="10">
        <li>
          <button type="button" aria-label="{{f.aria}}" aria-disabled="{{f.bloqueada}}" aria-pressed="{{f.seleccionada}}" onClick="{{f.elixir}}" style="width: 100%; min-height: 48px; padding: 0 12px; border-radius: 8px; border: {{f.borde}}; background: {{f.fondo}}; color: {{f.texto}}; font: inherit; cursor: {{f.cursor}}; display: flex; align-items: center; justify-content: space-between; gap: 12px">
            <span style="font-weight: 700">{{f.hora}}</span>
            <span>{{f.rotulo}}</span>
          </button>
        </li>
      </sc-for>
    </ul>
    <section aria-labelledby="afluencia-mobil" style="margin-top: 16px">
      <h2 id="afluencia-mobil" style="margin: 0 0 4px; font-size: 20px">Afluencia por día e hora</h2>
      <p style="margin: 0 0 8px; font-size: 14px; color: var(--texto2)">Ocupación da semana mostrada.</p>
      <ul aria-label="Lenda da afluencia" style="list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px">
        <sc-for list="{{lendaAfluencia}}" as="l" hint-placeholder-count="5"><li style="display: inline-flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 14px; height: 14px; border: 1px solid var(--linea-forte); background: {{l.fondo}}"></span>{{l.rango}}</li></sc-for>
      </ul>
      <div tabindex="0" style="overflow-x: auto; border: 1px solid var(--linea); padding: 4px">
        <div role="table" aria-label="Afluencia por día e hora" style="min-width: 280px; display: flex; flex-direction: column; gap: 2px">
          <div role="row" style="display: grid; grid-template-columns: 44px repeat(7, minmax(0, 1fr)); gap: 2px">
            <div role="columnheader" style="font-size: 11px">Hora</div>
            <sc-for list="{{mapa.dias}}" as="d" hint-placeholder-count="7"><div role="columnheader" style="text-align: center; font-size: 11px; line-height: 1.15">{{d.curto}}<br>{{d.numero}}</div></sc-for>
          </div>
          <sc-for list="{{mapa.filas}}" as="f" hint-placeholder-count="13">
            <div role="row" style="display: grid; grid-template-columns: 44px repeat(7, minmax(0, 1fr)); gap: 2px">
              <div role="rowheader" style="display: flex; align-items: center; font-size: 10px">{{f.hora}}</div>
              <sc-for list="{{f.celas}}" as="c" hint-placeholder-count="7"><div role="cell" aria-label="{{c.aria}}" style="min-height: 30px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--linea-forte); background: {{c.fondo}}; color: {{c.tinta}}; font-size: 10px; font-weight: 700; text-align: center">{{c.rotulo}}</div></sc-for>
            </div>
          </sc-for>
        </div>
      </div>
      <p style="margin: 6px 0 12px; font-size: 13px; color: var(--texto2)">Calcúlase coas reservas feitas; a predición chegará cando haxa histórico</p>

        <p style="margin: 0 0 8px">{{resumo}}</p>
        <p style="margin: 0 0 8px; font-weight: 700">Pagamento na instalación · {{importeTexto}} estimados</p>
        <button type="button" onClick="{{engadirCalendario}}" style="min-height: 48px; width: 100%; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--texto); background: var(--fondo); color: var(--texto); font: inherit; font-weight: 700; cursor: pointer">Engadir ao meu calendario (.ics)</button>
        <a href="ReservaMobil.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: {{marca}}; color: {{sobreMarca}}; text-decoration: none; font-weight: 700">Ver o código QR</a>
      </div>
    </sc-if>
    <sc-if value="{{pasoConfirmar}}" hint-placeholder-val="{{ true }}">

// Días, meses e pequenos fragmentos dentro de textos xerados.
const MESES_ES = { novembro: 'noviembre', outubro: 'octubre', decembro: 'diciembre', setembro: 'septiembre', agosto: 'agosto' };
const FRAGMENTOS_ES = [
  [/Pistas de pádel do Campo da Feira/g, 'Pistas de pádel de Campo da Feira'],
  [/Piscina Municipal A Ribeira/g, 'Piscina Municipal A Ribeira'],
  [/Pavillón Municipal/g, 'Pabellón Municipal'],
  [/Campo de fútbol de Santa Mariña/g, 'Campo de fútbol de Santa Mariña'],
  [/Pistas de tenis de Outeiro/g, 'Pistas de tenis de Outeiro'],
  [/Sala Polivalente da Casa da Cultura/g, 'Sala Polivalente de la Casa de la Cultura'],
  [/Todas as pistas de pádel/g, 'Todas las pistas de pádel'],
  [/\bPavillón, Pista central/g, 'Pabellón, Pista central'],
  [/\bPavillón, /g, 'Pabellón, '],
  [/\bPádel, /g, 'Pádel, '],
  [/\bPista (\d+)/g, 'Pista $1'],
  [/\bRúa (\d)/g, 'Carril $1'],
  [/\b(Luns|luns)\b/g, 'lunes'],
  [/\b(Martes|martes)\b/g, 'martes'],
  [/\b(Mércores|mércores)\b/g, 'miércoles'],
  [/\b(Xoves|xoves)\b/g, 'jueves'],
  [/\b(Venres|venres)\b/g, 'viernes'],
  [/\b(Sábado|sábado)\b/g, 'sábado'],
  [/\b(Domingo|domingo)\b/g, 'domingo'],
  [/\b(\d{1,2}) de (novembro|outubro|decembro|setembro|agosto)(?: de (\d{4}))?/g, (m, d, mes, ano) => d + ' de ' + MESES_ES[mes] + (ano ? ' de ' + ano : '')],
  [/\bHoxe\b/g, 'Hoy'],
  [/ semana do (\d+) ao (\d+) /, ' semana del $1 al $2 '],
  [/, todo o día$/, ', todo el día'],
  [/, a túa reserva$/, ', tu reserva'],
  [/, A túa reserva$/, ', tu reserva'],
  [/, libre$/, ', libre'],
  [/, ocupada$/, ', ocupada'],
  [/, pechada$/, ', cerrada'],
  [/, escollida$/, ', seleccionada'],
  [/^(.+), abre$/, (m) => fragmentosEs(m[1]) + ', abre'],
  [/^(.+), pecha$/, (m) => fragmentosEs(m[1]) + ', cierra'],
  [/^(.+), todo o día sen corte$/, (m) => fragmentosEs(m[1]) + ', todo el día sin corte'],
  [/^(.+), abre pola mañá$/, (m) => fragmentosEs(m[1]) + ', abre por la mañana'],
  [/^(.+), pecha pola mañá$/, (m) => fragmentosEs(m[1]) + ', cierra por la mañana'],
  [/^(.+), abre pola tarde$/, (m) => fragmentosEs(m[1]) + ', abre por la tarde'],
  [/^(.+), pecha pola tarde$/, (m) => fragmentosEs(m[1]) + ', cierra por la tarde']
];
function fragmentosEs(s) {
  return FRAGMENTOS_ES.reduce((texto, [re, sustitucion]) => texto.replace(re, sustitucion), s);
}

function traducirEs(txt) {
  const orixe = txt.replace(/\s+/g, ' ').trim();
  if (!orixe) return txt;
  if (Object.prototype.hasOwnProperty.call(DIC_ES, orixe)) return txt.replace(orixe === txt ? txt : txt.trim(), DIC_ES[orixe]);
  for (const [re, f] of REGRAS_ES) {
    const m = orixe.match(re);
    if (m) return f(m);
  }
  if (orixe.includes(' · ')) return orixe.split(' · ').map(traducirEs).join(' · ');
  return fragmentosEs(orixe);
}
